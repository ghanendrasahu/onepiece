[project]
name = "onepiece"
version = "0.1.0"
description = "WorldView VR - immersive virtual travel platform (Python-first implementation)"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.uv.sources]
worldview = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit>=1.8",
    "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = [
    "B008",  # Depends() in FastAPI argument defaults is idiomatic
    "S105",  # schema string literals like token_type="bearer"
    "S106",  # pydantic Field defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of tests
"**/tests/**" = ["S101"]
"migrations/**" = ["E501", "UP007", "UP035", "I001"]  # Alembic-generated files
"migrations/env.py" = ["I001"]
"apps/ai_guide/src/worldview_ai_guide/knowledge.py" = ["E501"]  # natural-language seed prose
"apps/gateway/src/worldview_gateway/__main__.py" = ["S104"]  # dev/ops entrypoint binds all interfaces
"packages/worldview/src/worldview/testing.py" = ["S608"]  # table names come from live DB introspection, not user input

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["apps", "packages"]
addopts = "-q"

[tool.bandit]
targets = ["apps", "packages"]
exclude_dirs = ["tests", "migrations"]
skips = ["B101"]  # asserts are permitted in non-test production paths we own
