[project]
name = "worldview"
version = "0.1.0"
description = "WorldView VR shared library: config, auth, db, logging, idempotency"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "PyJWT>=2.10",
    "ulid-py>=1.1",
    "SQLAlchemy>=2.0.36",
    "email-validator>=2.2",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldview"]
