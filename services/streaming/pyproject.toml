[project]
name = "worldview-streaming"
version = "0.1.0"
description = "WorldView VR streaming-control service"
requires-python = ">=3.11"
dependencies = [
    "worldview>=0.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worldview_streaming"]
