[project]
name = "worldview-gateway"
version = "0.2.0"
description = "WorldView VR API gateway: single entry point, routing, rate limiting, TLS"
requires-python = ">=3.11"
dependencies = [
    "worldview>=0.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worldview_gateway"]