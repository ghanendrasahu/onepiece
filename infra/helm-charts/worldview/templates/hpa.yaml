{{- range $name, $cfg := .Values.services }}
{{- if and $cfg.enabled ($cfg.hpa | default true) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "worldview.serviceName" (dict "Release" $.Release "name" $name) }}
  labels:
    app.kubernetes.io/name: {{ $.Chart.Name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "worldview.serviceName" (dict "Release" $.Release "name" $name) }}
  minReplicas: {{ $cfg.minReplicas | default $.Values.serviceDefaults.minReplicas }}
  maxReplicas: {{ $cfg.maxReplicas | default $.Values.serviceDefaults.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $cfg.targetCPUUtilization | default $.Values.serviceDefaults.targetCPUUtilization }}
{{- end }}
{{- end }}