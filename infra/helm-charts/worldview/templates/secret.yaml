apiVersion: v1
kind: Secret
metadata:
  name: {{ include "worldview.fullname" . }}-credentials
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  {{- if not .Values.jwtSecret }}
  {{- fail "jwtSecret is required (helm install --set jwtSecret=<value>)" }}
  {{- end }}
  JWT_SECRET: {{ .Values.jwtSecret | b64enc | quote }}