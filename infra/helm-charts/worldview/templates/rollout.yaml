{{- range $name, $cfg := .Values.services }}
{{- if and $cfg.enabled (eq (include "worldview.rolloutEnabled" $cfg) "true") }}
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "worldview.serviceName" (dict "Release" $.Release "name" $name) }}
  labels:
    app.kubernetes.io/name: {{ $.Chart.Name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $cfg.replicas | default $.Values.serviceDefaults.minReplicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  strategy:
    canary:
      steps:
        - setWeight: 5
        - pause: { duration: 60 }
        - setWeight: 25
        - pause: { duration: 60 }
        - setWeight: 100
      analysis:
        templates:
          - templateName: {{ include "worldview.fullname" $ }}-{{ include "worldview.k8sName" $name }}
        args:
          - name: service
            value: {{ include "worldview.k8sName" $name }}
  {{- include "worldview.podTemplate" (dict "root" $ "name" $name "cfg" $cfg) | nindent 2 }}
{{- end }}
{{- end }}