apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "worldview.fullname" . }}-common
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  ENV: {{ .Values.env | quote }}
  REGION_KEY: {{ .Values.region | quote }}
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  JWT_ALGORITHM: {{ .Values.jwtAlgorithm | quote }}
  JWT_ACCESS_TTL_MINUTES: "15"
  JWT_REFRESH_TTL_DAYS: "30"
  DATABASE_URL: {{ .Values.database.url | quote }}
  REDIS_URL: {{ .Values.redis.url | quote }}
  # Peer-service endpoints (in-cluster DNS), consumed by gateway + ai-guide.
  IDENTITY_UPSTREAM: {{ include "worldview.svcUrl" (dict "Release" .Release "name" "identity") }}
  CATALOG_UPSTREAM: {{ include "worldview.svcUrl" (dict "Release" .Release "name" "catalog") }}
  STREAMING_UPSTREAM: {{ include "worldview.svcUrl" (dict "Release" .Release "name" "streaming") }}
  AI_GUIDE_UPSTREAM: {{ include "worldview.svcUrl" (dict "Release" .Release "name" "ai_guide") }}
  CATALOG_SERVICE_URL: {{ include "worldview.svcUrl" (dict "Release" .Release "name" "catalog") }}
  AI_MODEL_GATEWAY_URL: {{ .Values.modelGatewayUrl | quote }}