{{- range $name, $cfg := .Values.services }}
{{- if $cfg.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "worldview.serviceName" (dict "Release" $.Release "name" $name) }}
  labels:
    app.kubernetes.io/name: {{ $.Chart.Name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $cfg.replicas | default $.Values.serviceDefaults.minReplicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      serviceAccountName: {{ include "worldview.fullname" $ }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: {{ $name }}
          image: {{ include "worldview.image" (dict "root" $ "service" $name) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $.Values.serviceDefaults.port }}
          envFrom:
            - configMapRef:
                name: {{ include "worldview.fullname" $ }}-common
            - secretRef:
                name: {{ include "worldview.fullname" $ }}-credentials
          env:
            {{- with $cfg.env }}
            {{- range $k, $v := . }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml $.Values.serviceDefaults.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
{{- end }}
{{- end }}