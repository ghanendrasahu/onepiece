[project]
name = "worldview-payments"
version = "0.1.0"
description = "WorldView VR payments, subscriptions, billing & tips service"
requires-python = ">=3.11"
dependencies = [
    "worldview>=0.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldview_payments"]