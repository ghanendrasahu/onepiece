name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: worldview
          POSTGRES_PASSWORD: worldview
          POSTGRES_DB: worldview_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U worldview"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      WORLDVIEW_TEST_DATABASE_URL: postgresql+psycopg://worldview:worldview@localhost:5432/worldview_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync workspace
        run: uv sync --all-packages --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: SAST (bandit)
        run: uv run bandit -q -r libs services -x '*/tests/*,*/migrations/*'

      - name: Dependency audit (pip-audit)
        run: uv run pip-audit

      - name: Migrate (Postgres)
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: ${{ env.WORLDVIEW_TEST_DATABASE_URL }}

      - name: Migration drift check
        run: uv run alembic check
        env:
          DATABASE_URL: ${{ env.WORLDVIEW_TEST_DATABASE_URL }}

      - name: Test (PostgreSQL)
        run: uv run pytest

      - name: Smoke test
        run: uv run python scripts/smoke_test.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: python
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      matrix:
        service: [identity, catalog, streaming, ai_guide, gateway]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg SERVICE=${{ matrix.service }} -f infra/docker/Dockerfile.service -t worldview/${{ matrix.service }} .

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: worldview/${{ matrix.service }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image=ghcr.io/${{ github.repository_owner }}/worldview-${{ matrix.service }}
          docker tag worldview/${{ matrix.service }} $image:${{ github.sha }}
          docker tag worldview/${{ matrix.service }} $image:latest
          docker push $image:${{ github.sha }}
          docker push $image:latest

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.3
      - name: Lint chart
        run: helm lint infra/helm-charts/worldview --set jwtSecret=ci-only-secret-0123456789abcdef
      - name: Render manifests
        run: |
          helm template worldview infra/helm-charts/worldview \
            --namespace prod \
            --set jwtSecret=ci-only-secret-0123456789abcdef \
            > /tmp/rendered.yaml
          grep -q "kind: Job" /tmp/rendered.yaml
          grep -q "name: worldview-ai-guide" /tmp/rendered.yaml